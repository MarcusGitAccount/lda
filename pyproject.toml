[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-anonymizer"
version = "0.1.0"
description = "Reversible anonymization of Romanian and English legal documents, built on Presidio."
requires-python = ">=3.11,<3.15"
dependencies = [
    "presidio-analyzer>=2.2.360",
    "spacy>=3.7",
    "transformers>=4.40",
    "torch>=2.2",
    "lxml>=5.0",
    "pdfminer.six>=20231228",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# GLiNER (level "medium" and "high"). Its tokenizer does not load with transformers 5, so we pin 4.x.
gliner = ["gliner>=0.2.29,<1.0", "transformers>=4.51.3,<5", "huggingface_hub>=0.30,<1.0", "protobuf>=4.25"]
dev = ["pytest>=8.0", "httpx>=0.27", "reportlab>=4.0", "python-docx>=1.1"]

[project.scripts]
lda = "legal_anonymizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["models: needs the NER models (slow, downloads on first run)"]
